<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Manasa Tailor</title>
  <meta name="description" content="Track your orders, quotations, measurements and order status with Manasa Tailor.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --rose: #c9728a;
      --rose-light: #f5e6eb;
      --rose-dark: #8b3d52;
      --gold: #b8924a;
      --gold-dark: #7f6533;
      --gold-light: #f7f0e3;
      --cream: #fdf8f5;
      --dark: #2c1a20;
      --muted: #7a5a64;
      --border: #e8d5da;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--rose-dark);
      letter-spacing: 1px;
      text-decoration: none;
    }

    .nav-logo span { color: var(--gold); font-style: italic; }

    .nav-right { display: flex; align-items: center; gap: 16px; }

    .user-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dark); font-weight: 500; text-decoration: none; transition: color .2s; }
    .user-chip:hover { color: var(--rose-dark); }
    .user-chip i { color: var(--rose); font-size: 18px; }

    .btn-primary {
      background: var(--rose-dark);
      color: white;
      border: none;
      padding: 12px 28px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
    }

    .btn-primary:hover:not(:disabled) { background: var(--rose); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 61, 82, .25); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--rose-dark);
      border: 1px solid var(--rose-dark);
      padding: 12px 28px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
    }

    .btn-outline:hover { background: var(--rose-dark); color: white; transform: translateY(-2px); }
    .btn-outline:active { transform: translateY(0); }

    .nav-logout { padding: 8px 16px; font-size: 11px; }

    /* ── Notification bell ── */
    .notif-wrap { position: relative; }

    .notif-bell {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--muted);
      font-size: 20px;
      display: flex;
      align-items: center;
      transition: color .2s;
    }

    .notif-bell:hover { color: var(--rose-dark); }

    .notif-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--rose-dark);
      color: white;
      font-size: 9px;
      font-weight: 600;
      min-width: 15px;
      height: 15px;
      border-radius: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    .notif-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 320px;
      max-width: 90vw;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity .15s, transform .15s;
      z-index: 200;
      max-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .notif-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .notif-dropdown-header {
      padding: 14px 16px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }

    .notif-list { overflow-y: auto; }

    .notif-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-align: left;
      font-family: 'Jost', sans-serif;
    }

    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: var(--rose-light); }
    .notif-item-icon { color: var(--rose); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
    .notif-item-body { display: flex; flex-direction: column; gap: 3px; }
    .notif-item-title { font-size: 12.5px; color: var(--dark); font-weight: 600; }
    .notif-item-msg { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .notif-item-time { font-size: 10.5px; color: var(--muted); }
    .notif-empty { padding: 24px 16px; text-align: center; font-size: 12px; color: var(--muted); }

    /* ── Main ── */
    .dash-main { max-width: 960px; margin: 0 auto; padding: 40px 32px 80px; flex: 1; width: 100%; }

    .dash-welcome { margin-bottom: 32px; }
    .dash-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 8px; font-weight: 500; }
    .dash-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; color: var(--dark); margin-bottom: 6px; }
    .dash-title em { font-style: italic; color: var(--rose); }
    .dash-subtitle { font-size: 13px; color: var(--muted); }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .summary-card { background: white; border: 1px solid var(--border); border-radius: 4px; padding: 22px 20px; display: flex; flex-direction: column; gap: 6px; transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
    .summary-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(44, 26, 32, .07); }
    .summary-card i { color: var(--rose); font-size: 22px; margin-bottom: 4px; }
    .summary-num { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: var(--dark); line-height: 1; }
    .summary-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; }

    .dash-cta { margin-bottom: 40px; }

    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--dark); margin-bottom: 16px; }

    .orders-list { display: flex; flex-direction: column; gap: 14px; }

    .orders-loading, .orders-empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .orders-empty i { font-size: 32px; color: var(--rose); display: block; margin-bottom: 12px; }
    .orders-empty p { margin-bottom: 16px; }
    .orders-empty.error { color: #b23b3b; }

    .order-card { background: white; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; transition: border-color .25s var(--ease), box-shadow .25s var(--ease); }
    .order-card:hover { border-color: var(--rose); box-shadow: 0 8px 20px rgba(44, 26, 32, .06); }

    .order-card-summary {
      width: 100%;
      background: none;
      border: none;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }

    .order-card-id { font-size: 11px; letter-spacing: 1px; color: var(--muted); font-weight: 500; text-transform: uppercase; margin-bottom: 2px; }
    .order-card-garment { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--dark); margin-bottom: 2px; }
    .order-card-meta { font-size: 12px; color: var(--muted); }
    .order-card-side { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .order-toggle-icon { color: var(--muted); transition: transform .3s var(--ease); }
    .order-toggle-icon.rotated { transform: rotate(180deg); }

    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
    .badge-yellow { background: #fbf0d9; color: #8a6a1f; }
    .badge-blue { background: #e2ecf5; color: #2f5a82; }
    .badge-green { background: #e3f0e3; color: #2f6b3f; }
    .badge-check { background: var(--rose-light); color: var(--rose-dark); }
    .badge-muted { background: #ececec; color: #777; }

    .order-detail {
      border-top: 1px solid var(--border); padding: 0 20px; display: flex; flex-direction: column; gap: 18px; background: var(--cream);
      max-height: 0; overflow: hidden; opacity: 0; border-top-color: transparent;
      transition: max-height .4s var(--ease), padding .4s var(--ease), opacity .3s var(--ease), border-color .4s var(--ease);
    }
    .order-detail.open { max-height: 2000px; padding: 20px; opacity: 1; border-top-color: var(--border); }

    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 20px; }
    .detail-field { display: flex; flex-direction: column; gap: 2px; }
    .detail-field-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .detail-field-value { font-size: 13px; color: var(--dark); }

    .detail-collapse { background: white; border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; }
    .detail-collapse summary { cursor: pointer; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--rose-dark); font-weight: 500; }
    .detail-collapse[open] summary { margin-bottom: 12px; }

    .detail-block { background: white; border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; }
    .detail-block-title { display: flex; align-items: center; gap: 8px; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--rose-dark); font-weight: 500; margin-bottom: 14px; }
    .detail-empty { font-size: 12px; color: var(--muted); }

    .measure-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .measure-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 10px; background: var(--cream); border-radius: 3px; }
    .measure-row span:first-child { color: var(--muted); text-transform: capitalize; }
    .measure-row span:last-child { color: var(--dark); font-weight: 500; }

    .quotation-box { display: flex; flex-direction: column; gap: 4px; }
    .quotation-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 6px 0; }
    .quotation-row span:last-child { color: var(--dark); font-weight: 500; }
    .quotation-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }
    .quotation-total span { color: var(--rose-dark) !important; font-size: 15px; font-weight: 600 !important; }
    .quotation-notes { font-size: 12px; color: var(--muted); background: var(--cream); border-radius: 3px; padding: 10px 12px; margin-top: 6px; }
    .quotation-actions { display: flex; gap: 10px; margin-top: 10px; }
    .quotation-actions button { flex: 1; justify-content: center; }

    .timeline { display: flex; flex-direction: column; }
    .timeline-step { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; position: relative; }
    .timeline-step:not(:last-child)::before { content: ''; position: absolute; left: 9px; top: 24px; bottom: -6px; width: 1px; background: var(--border); }
    .timeline-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .timeline-label { font-size: 13px; color: var(--muted); }
    .timeline-step.done .timeline-label { color: var(--dark); font-weight: 500; }
    .timeline-step.current .timeline-label { color: var(--rose-dark); font-weight: 600; }
    .timeline-date { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .timeline-current-tag { font-size: 11px; color: var(--rose); font-style: italic; margin-left: 6px; }
    .timeline-cancelled { display: flex; align-items: center; gap: 8px; color: #b23b3b; font-size: 13px; font-weight: 500; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .photo-thumb { padding: 0; border: none; background: none; cursor: pointer; aspect-ratio: 1; border-radius: 3px; overflow: hidden; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); transition: transform .15s; }
    .photo-thumb:hover img { transform: scale(1.04); }

    /* ── Lightbox ── */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px; }
    .lightbox-close { position: fixed; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1; opacity: .8; }
    .lightbox-close:hover { opacity: 1; }

    /* ── Footer ── */
    .footer-mini { background: var(--dark); padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-mini p { font-size: 11px; color: rgba(255,255,255,.4); }
    .footer-mini a { font-size: 11px; color: rgba(255,255,255,.5); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color .2s; }
    .footer-mini a:hover { color: var(--rose); }

    /* ── Floating WhatsApp ── */
    .wa-float { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; box-shadow: 0 4px 16px rgba(37,211,102,.45); z-index: 999; text-decoration: none; transition: transform .2s; }
    .wa-float:hover { transform: scale(1.1); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .nav { padding: 14px 16px; }
      .dash-main { padding: 28px 18px 60px; }
      .dash-title { font-size: 26px; }
      .summary-grid { grid-template-columns: 1fr; }
      .detail-grid, .measure-grid { grid-template-columns: 1fr; }
      .order-card-summary { align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .user-chip { display: none; }
      .nav-logout span { display: none; }
      .nav-logout { padding: 10px; }
      .notif-dropdown { position: fixed; top: 68px; right: 12px; left: 12px; width: auto; max-width: none; }
      .quotation-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">Manasa <span>Tailor</span></a>
    <div class="nav-right">
      <div class="notif-wrap">
        <button type="button" class="notif-bell" id="notifBellBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          <i class="ti ti-bell" aria-hidden="true"></i>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">Notifications</div>
          <div class="notif-list" id="notifList">
            <p class="notif-empty">Loading…</p>
          </div>
        </div>
      </div>
      <a href="profile.html" class="user-chip" title="My Profile">
        <i class="ti ti-user-circle" aria-hidden="true"></i>
        <span id="userNameChip">—</span>
      </a>
      <button type="button" class="btn-outline nav-logout" onclick="logout()">
        <i class="ti ti-logout" aria-hidden="true"></i> <span>Logout</span>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="dash-main">
    <div class="dash-welcome">
      <p class="dash-eyebrow">Your Account</p>
      <h1 class="dash-title">Welcome back, <em id="welcomeName">…</em>!</h1>
      <p class="dash-subtitle">Here's what's happening with your orders.</p>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <i class="ti ti-shirt" aria-hidden="true"></i>
        <div class="summary-num" id="activeOrdersCount">0</div>
        <div class="summary-label">Active Orders</div>
      </div>
      <div class="summary-card">
        <i class="ti ti-file-invoice" aria-hidden="true"></i>
        <div class="summary-num" id="pendingApprovalCount">0</div>
        <div class="summary-label">Pending Approval</div>
      </div>
      <div class="summary-card">
        <i class="ti ti-package" aria-hidden="true"></i>
        <div class="summary-num" id="readyCollectCount">0</div>
        <div class="summary-label">Ready to Collect</div>
      </div>
    </div>

    <a href="booking.html" class="btn-primary dash-cta">
      <i class="ti ti-calendar-plus" aria-hidden="true"></i> Book New Appointment
    </a>

    <section>
      <h2 class="section-title">My Orders</h2>
      <div id="ordersList" class="orders-list">
        <p class="orders-loading">Loading your orders…</p>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button type="button" class="lightbox-close" onclick="closeLightbox()" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
    <img id="lightboxImg" src="" alt="Your outfit photo, full size">
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/916360194277?text=Hi%20Manasa%20Tailor!%20I%20have%20a%20question%20about%20my%20order."
     target="_blank" rel="noopener" class="wa-float" aria-label="Chat on WhatsApp">
    <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
  </a>

  <!-- Footer -->
  <footer class="footer-mini">
    <p>© <span id="yr"></span> Manasa Tailor. All rights reserved.</p>
    <a href="index.html">
      <i class="ti ti-needle-thread" aria-hidden="true"></i>
      Manasa Tailor — Tumkur, Karnataka
    </a>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    var USER_STORAGE_KEY = 'manasaUser';
    var TIMELINE_STAGES = ['Quotation Requested', 'Quotation Sent', 'Order Confirmed', 'Measurement Taken', 'Work In Progress', 'Ready for Collection', 'Delivered'];

    var CURRENT_USER = null;
    var orders = [];
    var quotations = [];
    var notifications = [];
    var measurementsByGarment = {};

    // ---------- Session guard ----------

    (function guardSession() {
      try {
        CURRENT_USER = JSON.parse(localStorage.getItem(USER_STORAGE_KEY) || 'null');
      } catch (err) {
        CURRENT_USER = null;
      }
      if (!CURRENT_USER || !CURRENT_USER.userId) {
        window.location.replace('login.html');
      }
    })();

    function logout() {
      localStorage.removeItem(USER_STORAGE_KEY);
      window.location.href = 'index.html';
    }

    // ---------- Helpers ----------

    function esc(str) {
      return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function firstName(fullName) {
      return (fullName || '').trim().split(/\s+/)[0] || 'there';
    }

    // ---------- Lightbox ----------

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
      if (!e || e.target !== document.getElementById('lightboxImg')) {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

    function formatDate(value) {
      if (!value) return '';
      var date = new Date(value);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatMoney(n) {
      return '₹' + (Number(n) || 0).toLocaleString('en-IN');
    }

    // callApi() is defined once, shared, in config.js.

    // ---------- Data loading ----------

    function loadDashboardData() {
      // Deferring the Promise.all([...]) construction into a .then() means
      // a *synchronous* throw from any callApi() call (e.g. CONFIG not
      // loaded yet) becomes a normal rejection instead of an uncaught
      // exception — without this, such a throw happens while JS is still
      // evaluating the array literal, before Promise.all is even called,
      // so .catch() below would never run and the page would stay on
      // "Loading…" forever with no visible error.
      Promise.resolve().then(function () {
        return Promise.all([
          callApi('getOrdersByUser', { userId: CURRENT_USER.userId }),
          callApi('getQuotationsByUser', { userId: CURRENT_USER.userId }),
          callApi('getMeasurementsByUser', { userId: CURRENT_USER.userId }),
          callApi('getNotifications', { userId: CURRENT_USER.userId })
        ]);
      }).then(function (results) {
        var ordersRes = results[0], quotationsRes = results[1], measurementsRes = results[2], notifsRes = results[3];

        orders = (ordersRes && ordersRes.success) ? ordersRes.data.orders : [];
        quotations = (quotationsRes && quotationsRes.success) ? quotationsRes.data.quotations : [];
        notifications = (notifsRes && notifsRes.success) ? notifsRes.data.notifications : [];

        measurementsByGarment = {};
        if (measurementsRes && measurementsRes.success) {
          measurementsRes.data.measurements.forEach(function (m) { measurementsByGarment[m.garment] = m; });
        }

        renderSummary();
        renderOrders();
        renderNotifDropdown();
        updateNotifBadge();
      }).catch(function (err) {
        console.error('loadDashboardData failed:', err);
        document.getElementById('ordersList').innerHTML =
          '<p class="orders-empty error">Couldn\'t load your orders. Please refresh the page or check your connection.</p>';
        document.getElementById('notifList').innerHTML = '<p class="notif-empty">Couldn\'t load notifications.</p>';
      });
    }

    // ---------- Summary cards ----------

    function renderSummary() {
      var active = orders.filter(function (o) { return o.Status !== 'Delivered' && o.Status !== 'Cancelled'; }).length;
      var pending = orders.filter(function (o) { return o.Status === 'Quotation Sent'; }).length;
      var ready = orders.filter(function (o) { return o.Status === 'Ready for Collection'; }).length;
      document.getElementById('activeOrdersCount').textContent = active;
      document.getElementById('pendingApprovalCount').textContent = pending;
      document.getElementById('readyCollectCount').textContent = ready;
    }

    // ---------- Orders list ----------

    function statusBadge(status) {
      var map = {
        'Quotation Requested': { cls: 'badge-yellow', emoji: '🟡' },
        'Quotation Sent': { cls: 'badge-yellow', emoji: '🟡' },
        'Order Confirmed': { cls: 'badge-blue', emoji: '🔵' },
        'Measurement Taken': { cls: 'badge-blue', emoji: '🔵' },
        'Work In Progress': { cls: 'badge-blue', emoji: '🔵' },
        'Ready for Collection': { cls: 'badge-green', emoji: '🟢' },
        'Delivered': { cls: 'badge-check', emoji: '✅' },
        'Cancelled': { cls: 'badge-muted', emoji: '⚪' }
      };
      return map[status] || { cls: 'badge-muted', emoji: '⚪' };
    }

    function renderOrders() {
      var list = document.getElementById('ordersList');
      if (!orders.length) {
        list.innerHTML =
          '<div class="orders-empty">' +
            '<i class="ti ti-shirt-off" aria-hidden="true"></i>' +
            '<p>No orders yet. Ready to get started?</p>' +
            '<a href="booking.html" class="btn-primary">Book Your First Appointment</a>' +
          '</div>';
        return;
      }
      list.innerHTML = orders.map(orderCardHtml).join('');
    }

    function orderCardHtml(order) {
      var orderQuotations = quotations
        .filter(function (q) { return q.OrderID === order.OrderID; })
        .sort(function (a, b) { return new Date(b.CreatedAt) - new Date(a.CreatedAt); });
      var latestQuotation = orderQuotations[0] || null;
      var orderNotifs = notifications.filter(function (n) { return n.OrderID === order.OrderID; });
      var badge = statusBadge(order.Status);
      var amountLabel = latestQuotation ? formatMoney(latestQuotation.TotalAmount) : '—';

      return '' +
        '<div class="order-card" id="order-' + esc(order.OrderID) + '">' +
          '<button type="button" class="order-card-summary" onclick="toggleOrder(\'' + order.OrderID + '\')" aria-expanded="false">' +
            '<div class="order-card-main">' +
              '<div class="order-card-id">' + esc(order.OrderID) + '</div>' +
              '<div class="order-card-garment">' + esc(order.Garment) + '</div>' +
              '<div class="order-card-meta">Placed ' + formatDate(order.CreatedAt) + ' · ' + amountLabel + '</div>' +
            '</div>' +
            '<div class="order-card-side">' +
              '<span class="badge ' + badge.cls + '">' + badge.emoji + ' ' + esc(order.Status) + '</span>' +
              '<i class="ti ti-chevron-down order-toggle-icon" aria-hidden="true"></i>' +
            '</div>' +
          '</button>' +
          '<div class="order-detail" id="detail-' + esc(order.OrderID) + '">' +
            '<div class="detail-grid">' +
              detailField('Purpose', order.Purpose) +
              detailField('Preferred Date', order.Date) +
              detailField('Time Slot', order.TimeSlot) +
              detailField('Notes', order.Notes) +
            '</div>' +
            '<details class="detail-collapse"><summary>Measurements</summary>' + renderMeasurements(order) + '</details>' +
            '<div class="detail-block"><h4 class="detail-block-title"><i class="ti ti-receipt" aria-hidden="true"></i> Quotation</h4>' + renderQuotation(order, latestQuotation) + '</div>' +
            '<div class="detail-block"><h4 class="detail-block-title"><i class="ti ti-timeline" aria-hidden="true"></i> Status Timeline</h4>' + renderTimeline(order, orderNotifs) + '</div>' +
            renderPhotos(order) +
          '</div>' +
        '</div>';
    }

    function detailField(label, value) {
      if (!value) return '';
      return '<div class="detail-field"><span class="detail-field-label">' + esc(label) + '</span><span class="detail-field-value">' + esc(value) + '</span></div>';
    }

    function renderMeasurements(order) {
      var m = measurementsByGarment[order.Garment];
      if (!m || !m.measurements || !Object.keys(m.measurements).length) {
        return '<p class="detail-empty">No measurements saved yet.</p>';
      }
      var rows = Object.keys(m.measurements).map(function (key) {
        return '<div class="measure-row"><span>' + esc(key) + '</span><span>' + esc(m.measurements[key]) + '</span></div>';
      }).join('');
      return '<div class="measure-grid">' + rows + '</div>';
    }

    function renderQuotation(order, quotation) {
      if (!quotation) {
        return '<p class="detail-empty">No quotation yet — we\'ll notify you once one is ready.</p>';
      }

      var rows = quotationRow('Stitching', quotation.StitchingCost) + quotationRow('Fabric', quotation.FabricCost);
      if (Number(quotation.AdditionalCost) > 0) rows += quotationRow('Additional', quotation.AdditionalCost);

      var timelineHtml = quotation.DeliveryTimeline
        ? '<p class="quotation-notes"><i class="ti ti-truck-delivery" aria-hidden="true"></i> Delivery: ' + esc(quotation.DeliveryTimeline) + '</p>'
        : '';
      var actionsHtml = '';
      if (order.Status === 'Quotation Sent') {
        actionsHtml =
          '<div class="quotation-actions">' +
            '<button type="button" class="btn-primary" onclick="handleQuotationDecision(\'' + order.OrderID + '\',\'' + quotation.QuotationID + '\',\'approve\')">Approve</button>' +
            '<button type="button" class="btn-outline" onclick="handleQuotationDecision(\'' + order.OrderID + '\',\'' + quotation.QuotationID + '\',\'reject\')">Reject</button>' +
          '</div>';
      }

      return '' +
        '<div class="quotation-box">' +
          rows +
          '<div class="quotation-row quotation-total"><span>Total</span><span>' + formatMoney(quotation.TotalAmount) + '</span></div>' +
          timelineHtml + actionsHtml +
        '</div>';
    }

    function quotationRow(label, amount) {
      return '<div class="quotation-row"><span>' + esc(label) + '</span><span>' + formatMoney(amount) + '</span></div>';
    }

    function renderTimeline(order, orderNotifs) {
      if (order.Status === 'Cancelled') {
        return '<p class="timeline-cancelled"><i class="ti ti-x" aria-hidden="true"></i> This order was cancelled.</p>';
      }

      var currentIndex = TIMELINE_STAGES.indexOf(order.Status);
      var steps = TIMELINE_STAGES.map(function (stage, i) {
        var notif = orderNotifs.filter(function (n) { return n.Type === stage; })[0];
        var dateStr = notif ? formatDate(notif.CreatedAt) : '';
        var isFinal = stage === 'Delivered';
        var state;
        if (i < currentIndex || (i === currentIndex && isFinal)) {
          state = 'done';
        } else if (i === currentIndex) {
          state = 'current';
        } else {
          state = 'pending';
        }

        var icon = state === 'done' ? '✅' : (state === 'current' ? '🔵' : '⬜');
        var dateHtml = dateStr ? '<span class="timeline-date">— ' + esc(dateStr) + '</span>' : '';
        var currentTag = state === 'current' ? '<span class="timeline-current-tag">← current</span>' : '';

        return '' +
          '<div class="timeline-step ' + state + '">' +
            '<span class="timeline-icon">' + icon + '</span>' +
            '<span class="timeline-label">' + esc(stage) + dateHtml + currentTag + '</span>' +
          '</div>';
      });

      return '<div class="timeline">' + steps.join('') + '</div>';
    }

    function renderPhotos(order) {
      if (order.Status !== 'Ready for Collection' && order.Status !== 'Delivered') return '';
      var urls = String(order.PhotoURLs || '').split(',').map(function (u) { return u.trim(); }).filter(function (u) { return /^https:\/\//i.test(u); });
      if (!urls.length) return '';
      var imgs = urls.map(function (u) {
        return '<button type="button" class="photo-thumb" onclick="openLightbox(\'' + u + '\')" aria-label="View full size"><img src="' + esc(u) + '" alt="Your outfit photo" loading="lazy"></button>';
      }).join('');
      return '<div class="detail-block"><h4 class="detail-block-title"><i class="ti ti-photo" aria-hidden="true"></i> Your Outfit Photos</h4><div class="photo-grid">' + imgs + '</div></div>';
    }

    function toggleOrder(orderId) {
      var card = document.getElementById('order-' + orderId);
      var detail = document.getElementById('detail-' + orderId);
      var btn = card.querySelector('.order-card-summary');
      var icon = card.querySelector('.order-toggle-icon');
      var isOpen = detail.classList.contains('open');
      detail.classList.toggle('open', !isOpen);
      btn.setAttribute('aria-expanded', String(!isOpen));
      icon.classList.toggle('rotated', !isOpen);
    }

    function handleQuotationDecision(orderId, quotationId, decision) {
      if (decision === 'reject' && !confirm('Reject this quotation? We\'ll follow up with a revised one.')) return;

      // Only opened for 'approve' — the admin needs to know about an
      // approval, not a rejection (that's covered by their own notification).
      // Opened synchronously so the click carries the user gesture through
      // to the async response, same reasoning as booking.html's admin ping.
      var waTab = decision === 'approve' ? openWhatsAppRedirectTab_() : null;

      function succeed() {
        if (waTab) {
          var order = orders.filter(function (o) { return o.OrderID === orderId; })[0];
          var quotation = quotations.filter(function (q) { return q.QuotationID === quotationId; })[0];
          var msg = '✅ Order Confirmed!\n' +
            '👤 ' + (CURRENT_USER.name || 'A customer') + ' approved the quotation.\n' +
            '✂️ Service: ' + (order ? order.Garment : '') + '\n' +
            '💰 Amount: ' + formatMoney(quotation ? quotation.TotalAmount : 0) + '\n' +
            'Please proceed with scheduling.';
          waTab.location.href = 'https://wa.me/916360194277?text=' + encodeURIComponent(msg);
        }
        loadDashboardData();
      }

      // respondToQuotation can succeed server-side even when the response
      // never makes it back cleanly (same issue as everywhere else in this
      // app). It's not safe to just retry — approve/reject only work while
      // an order is "Quotation Sent", so a stray retry after a real
      // failure would correctly no-op, but retrying after a real success
      // could still confuse the flow. On failure, check whether the order
      // already moved off "Quotation Sent" before assuming this failed.
      function recoverOrFail() {
        callApi('getOrdersByUser', { userId: CURRENT_USER.userId }).then(function (checkRes) {
          var current = checkRes && checkRes.success && checkRes.data.orders.filter(function (o) { return o.OrderID === orderId; })[0];
          if (current && current.Status !== 'Quotation Sent') {
            orders = checkRes.data.orders;
            succeed();
          } else {
            if (waTab) waTab.close();
            alert("Couldn't reach the server. Please try again.");
          }
        }).catch(function () {
          if (waTab) waTab.close();
          alert("Couldn't reach the server. Please check your connection and try again.");
        });
      }

      callApi('respondToQuotation', { userId: CURRENT_USER.userId, orderId: orderId, quotationId: quotationId, decision: decision })
        .then(function (res) {
          if (res && res.success) {
            succeed();
          } else {
            if (waTab) waTab.close();
            alert((res && res.error) || 'Something went wrong. Please try again.');
          }
        })
        .catch(recoverOrFail);
    }

    // ---------- Notification bell ----------

    function notifIcon(type) {
      if (type === 'Ready for Collection') return 'ti-package';
      if (type === 'Quotation Sent') return 'ti-file-invoice';
      if (type === 'Order Confirmed') return 'ti-checkbox';
      if (type === 'Delivered') return 'ti-truck-delivery';
      return 'ti-bell';
    }

    // The Type column already IS the notification's category (it's reused
    // as the timeline stage name elsewhere) — this just gives it a
    // friendlier label for display instead of adding a separate Title
    // column to the sheet.
    function notifTitle(type) {
      var map = {
        'Quotation Requested': 'Order Received',
        'Quotation Sent': 'Quotation Ready',
        'Order Confirmed': 'Order Confirmed',
        'Ready for Collection': 'Ready for Collection'
      };
      return map[type] || 'Status Update';
    }

    function timeAgo(value) {
      if (!value) return '';
      var date = new Date(value);
      if (isNaN(date.getTime())) return '';
      var diffSec = Math.round((Date.now() - date.getTime()) / 1000);
      if (diffSec < 60) return 'Just now';
      var diffMin = Math.round(diffSec / 60);
      if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');
      var diffHr = Math.round(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
      var diffDay = Math.round(diffHr / 24);
      if (diffDay < 7) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
      return formatDate(value);
    }

    function renderNotifDropdown() {
      var list = document.getElementById('notifList');
      if (!notifications.length) {
        list.innerHTML = '<p class="notif-empty">No notifications yet.</p>';
        return;
      }
      list.innerHTML = notifications.map(function (n) {
        return '' +
          '<button type="button" class="notif-item' + (n.IsRead ? '' : ' unread') + '" onclick="handleNotifClick(\'' + n.NotificationID + '\')">' +
            '<i class="ti ' + notifIcon(n.Type) + ' notif-item-icon" aria-hidden="true"></i>' +
            '<span class="notif-item-body">' +
              '<span class="notif-item-title">' + esc(notifTitle(n.Type)) + '</span>' +
              '<span class="notif-item-msg">' + esc(n.Message) + '</span>' +
              '<span class="notif-item-time">' + timeAgo(n.CreatedAt) + '</span>' +
            '</span>' +
          '</button>';
      }).join('');
    }

    function updateNotifBadge() {
      var unreadCount = notifications.filter(function (n) { return !n.IsRead; }).length;
      var badge = document.getElementById('notifBadge');
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function handleNotifClick(notificationId) {
      var n = notifications.filter(function (x) { return x.NotificationID === notificationId; })[0];
      if (!n) return;

      if (!n.IsRead) {
        n.IsRead = true;
        renderNotifDropdown();
        updateNotifBadge();
        callApi('markNotificationRead', { userId: CURRENT_USER.userId, notificationId: notificationId }).catch(function () {});
      }

      document.getElementById('notifDropdown').classList.remove('open');

      if (n.OrderID) {
        var card = document.getElementById('order-' + n.OrderID);
        if (card) {
          var detail = document.getElementById('detail-' + n.OrderID);
          if (detail && detail.style.display === 'none') toggleOrder(n.OrderID);
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    document.getElementById('notifBellBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var dropdown = document.getElementById('notifDropdown');
      var isOpen = dropdown.classList.toggle('open');
      document.getElementById('notifBellBtn').setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', function (e) {
      var wrap = document.querySelector('.notif-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('notifDropdown').classList.remove('open');
        document.getElementById('notifBellBtn').setAttribute('aria-expanded', 'false');
      }
    });

    // ---------- Init ----------

    if (CURRENT_USER && CURRENT_USER.userId) {
      document.getElementById('welcomeName').textContent = firstName(CURRENT_USER.name);
      document.getElementById('userNameChip').textContent = CURRENT_USER.name || '';
      loadDashboardData();
    }
  </script>

</body>
</html>
