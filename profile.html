<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Manasa Tailor</title>
  <meta name="description" content="Manage your Manasa Tailor account details and password.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --rose: #c9728a;
      --rose-light: #f5e6eb;
      --rose-dark: #8b3d52;
      --gold: #b8924a;
      --gold-dark: #7f6533;
      --gold-light: #f7f0e3;
      --cream: #fdf8f5;
      --dark: #2c1a20;
      --muted: #7a5a64;
      --border: #e8d5da;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; background: white; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px;
    }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--rose-dark); letter-spacing: 1px; text-decoration: none; }
    .nav-logo span { color: var(--gold); font-style: italic; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .user-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dark); font-weight: 500; text-decoration: none; transition: color .2s; }
    .user-chip:hover { color: var(--rose-dark); }
    .user-chip i { color: var(--rose); font-size: 18px; }

    .btn-primary {
      background: var(--rose-dark); color: white; border: none; padding: 12px 28px;
      font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; transition: background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
    }
    .btn-primary:hover:not(:disabled) { background: var(--rose); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 61, 82, .25); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255, 255, 255, .45); border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 7px; }
    .loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px; color: var(--muted); font-size: 12px; }
    .loading-ring { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--rose); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

    .btn-outline {
      background: transparent; color: var(--rose-dark); border: 1px solid var(--rose-dark); padding: 12px 28px;
      font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
    }
    .btn-outline:hover { background: var(--rose-dark); color: white; transform: translateY(-2px); }
    .btn-outline:active { transform: translateY(0); }

    .nav-logout { padding: 8px 16px; font-size: 11px; }

    /* ── Notification bell ── */
    .notif-wrap { position: relative; }
    .notif-bell { position: relative; background: none; border: none; cursor: pointer; padding: 8px; color: var(--muted); font-size: 20px; display: flex; align-items: center; transition: color .2s; }
    .notif-bell:hover { color: var(--rose-dark); }
    .notif-badge {
      position: absolute; top: 2px; right: 2px; background: var(--rose-dark); color: white; font-size: 9px; font-weight: 600;
      min-width: 15px; height: 15px; border-radius: 20px; display: none; align-items: center; justify-content: center; padding: 0 3px;
    }
    .notif-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0; width: 320px; max-width: 90vw; background: white;
      border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
      opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity .15s, transform .15s;
      z-index: 200; max-height: 420px; display: flex; flex-direction: column;
    }
    .notif-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .notif-dropdown-header { padding: 14px 16px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    .notif-list { overflow-y: auto; }
    .notif-item { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; background: none; border: none; border-bottom: 1px solid var(--border); cursor: pointer; text-align: left; font-family: 'Jost', sans-serif; }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: var(--rose-light); }
    .notif-item-icon { color: var(--rose); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
    .notif-item-body { display: flex; flex-direction: column; gap: 3px; }
    .notif-item-title { font-size: 12.5px; color: var(--dark); font-weight: 600; }
    .notif-item-msg { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .notif-item-time { font-size: 10.5px; color: var(--muted); }
    .notif-empty { padding: 24px 16px; text-align: center; font-size: 12px; color: var(--muted); }

    /* ── Main ── */
    .profile-main { max-width: 620px; margin: 0 auto; padding: 40px 32px 80px; flex: 1; width: 100%; }

    .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .back-link {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 50%; border: 1px solid var(--border); color: var(--rose-dark); background: white;
      text-decoration: none; transition: background .2s, border-color .2s; flex-shrink: 0;
    }
    .back-link:hover { background: var(--rose-light); border-color: var(--rose); }
    .profile-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; color: var(--dark); }
    .profile-title em { font-style: italic; color: var(--rose); }

    .profile-card { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 28px; margin-bottom: 20px; transition: box-shadow .3s var(--ease); }
    .profile-card:hover { box-shadow: 0 10px 24px rgba(44, 26, 32, .06); }
    .profile-card-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--dark); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .profile-card-title i { color: var(--rose); font-size: 18px; }
    .profile-card-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 22px; }

    .auth-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .auth-field label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .auth-field label .optional { text-transform: none; letter-spacing: 0; opacity: .7; }
    .auth-field input {
      font-family: 'Jost', sans-serif; font-size: 13px; color: var(--dark); background: var(--cream);
      border: 1px solid var(--border); border-radius: 3px; padding: 11px 12px; outline: none;
      transition: border-color .25s var(--ease);
    }
    .auth-field input:focus { border-color: var(--rose); }
    .auth-field input[readonly] { background: #ece4e6; color: var(--muted); cursor: not-allowed; }

    .form-status { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 4px; }
    .form-status.success { color: var(--rose-dark); font-weight: 500; }
    .form-status.error { color: #b23b3b; font-weight: 500; }

    .quick-link-row { text-align: center; }
    .quick-link-row a { font-size: 12px; color: var(--rose-dark); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .quick-link-row a:hover { text-decoration: underline; }

    /* ── Footer ── */
    .footer-mini { background: var(--dark); padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-mini p { font-size: 11px; color: rgba(255,255,255,.4); }
    .footer-mini a { font-size: 11px; color: rgba(255,255,255,.5); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color .2s; }
    .footer-mini a:hover { color: var(--rose); }

    /* ── Floating WhatsApp ── */
    .wa-float { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; box-shadow: 0 4px 16px rgba(37,211,102,.45); z-index: 999; text-decoration: none; transition: transform .2s; }
    .wa-float:hover { transform: scale(1.1); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .nav { padding: 14px 16px; }
      .profile-main { padding: 28px 18px 60px; }
      .profile-title { font-size: 26px; }
      .profile-card { padding: 22px 20px; }
    }
    @media (max-width: 480px) {
      .user-chip span { display: none; }
      .nav-logout span { display: none; }
      .nav-logout { padding: 10px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">Manasa <span>Tailor</span></a>
    <div class="nav-right">
      <div class="notif-wrap">
        <button type="button" class="notif-bell" id="notifBellBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          <i class="ti ti-bell" aria-hidden="true"></i>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">Notifications</div>
          <div class="notif-list" id="notifList"><p class="notif-empty loading-row"><span class="loading-ring"></span> Loading…</p></div>
        </div>
      </div>
      <a href="profile.html" class="user-chip">
        <i class="ti ti-user-circle" aria-hidden="true"></i>
        <span id="userNameChip">—</span>
      </a>
      <button type="button" class="btn-outline nav-logout" onclick="logout()">
        <i class="ti ti-logout" aria-hidden="true"></i> <span>Logout</span>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="profile-main">
    <div class="profile-header">
      <a href="dashboard.html" class="back-link" aria-label="Back to dashboard"><i class="ti ti-arrow-left" aria-hidden="true"></i></a>
      <h1 class="profile-title">My <em>Profile</em></h1>
    </div>

    <div class="profile-card">
      <h2 class="profile-card-title"><i class="ti ti-id-badge-2" aria-hidden="true"></i> Personal Information</h2>
      <p class="profile-card-subtitle">Keep your contact details up to date so we can reach you.</p>

      <form id="profileForm" onsubmit="return handleProfileSave(event)">
        <div class="auth-field">
          <label for="profName">Full Name</label>
          <input id="profName" type="text" required>
        </div>
        <div class="auth-field">
          <label for="profEmail">Email</label>
          <input id="profEmail" type="email" readonly>
        </div>
        <div class="auth-field">
          <label for="profMobile">Mobile Number <span class="optional">(WhatsApp)</span></label>
          <input id="profMobile" type="tel" required>
        </div>
        <div class="auth-field">
          <label for="profCity">City / Area <span class="optional">(optional)</span></label>
          <input id="profCity" type="text">
        </div>
        <button type="submit" class="btn-primary" id="profSaveBtn">Save Changes</button>
        <p class="form-status" id="profStatus" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div class="profile-card">
      <h2 class="profile-card-title"><i class="ti ti-lock" aria-hidden="true"></i> Change Password</h2>
      <p class="profile-card-subtitle">Choose a new password with at least 8 characters.</p>

      <form id="passwordForm" onsubmit="return handlePasswordChange(event)">
        <div class="auth-field">
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="auth-field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="auth-field">
          <label for="confirmPassword">Confirm New Password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn-primary" id="passSaveBtn">Update Password</button>
        <p class="form-status" id="passStatus" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div class="quick-link-row">
      <a href="dashboard.html">View all your orders <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
    </div>
  </main>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/916360194277?text=Hi%20Manasa%20Tailor!%20I%20have%20a%20question%20about%20my%20account."
     target="_blank" rel="noopener" class="wa-float" aria-label="Chat on WhatsApp">
    <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
  </a>

  <!-- Footer -->
  <footer class="footer-mini">
    <p>© <span id="yr"></span> Manasa Tailor. All rights reserved.</p>
    <a href="index.html">
      <i class="ti ti-needle-thread" aria-hidden="true"></i>
      Manasa Tailor — Tumkur, Karnataka
    </a>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    var USER_STORAGE_KEY = 'manasaUser';

    var CURRENT_USER = null;
    var notifications = [];

    // ---------- Session guard ----------

    (function guardSession() {
      try {
        CURRENT_USER = JSON.parse(localStorage.getItem(USER_STORAGE_KEY) || 'null');
      } catch (err) {
        CURRENT_USER = null;
      }
      if (!CURRENT_USER || !CURRENT_USER.userId) {
        window.location.replace('login.html?redirect=profile.html');
      }
    })();

    function logout() {
      localStorage.removeItem(USER_STORAGE_KEY);
      window.location.href = 'index.html';
    }

    // ---------- Helpers ----------

    function esc(str) {
      return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = 'form-status' + (type ? ' ' + type : '');
    }

    function setBtnLoading(btn, loading, loadingText) {
      if (loading) {
        if (btn.dataset.originalHtml === undefined) btn.dataset.originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span>' + (loadingText || 'Please wait…');
      } else {
        if (btn.dataset.originalHtml !== undefined) btn.innerHTML = btn.dataset.originalHtml;
        btn.disabled = false;
      }
    }

    function formatDate(value) {
      if (!value) return '';
      var date = new Date(value);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function timeAgo(value) {
      if (!value) return '';
      var date = new Date(value);
      if (isNaN(date.getTime())) return '';
      var diffSec = Math.round((Date.now() - date.getTime()) / 1000);
      if (diffSec < 60) return 'Just now';
      var diffMin = Math.round(diffSec / 60);
      if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');
      var diffHr = Math.round(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
      var diffDay = Math.round(diffHr / 24);
      if (diffDay < 7) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
      return formatDate(value);
    }

    // callApi() is defined once, shared, in config.js.

    // ---------- Personal information ----------

    function fillProfileForm() {
      document.getElementById('profName').value = CURRENT_USER.name || '';
      document.getElementById('profEmail').value = CURRENT_USER.email || '';
      document.getElementById('profMobile').value = CURRENT_USER.mobile || '';
      document.getElementById('profCity').value = CURRENT_USER.city || '';
      document.getElementById('userNameChip').textContent = CURRENT_USER.name || '';
    }

    function handleProfileSave(e) {
      e.preventDefault();
      var btn = document.getElementById('profSaveBtn');
      var status = document.getElementById('profStatus');
      var name = document.getElementById('profName').value.trim();
      var mobile = document.getElementById('profMobile').value.trim();
      var city = document.getElementById('profCity').value.trim();

      if (!name || !mobile) {
        setStatus(status, 'Name and mobile number are required.', 'error');
        return false;
      }

      setBtnLoading(btn, true, 'Saving…');
      setStatus(status, '', '');

      callApi('updateUserProfile', { userId: CURRENT_USER.userId, name: name, mobile: mobile, city: city })
        .then(function (res) {
          if (res && res.success) {
            CURRENT_USER.name = name;
            CURRENT_USER.mobile = mobile;
            CURRENT_USER.city = city;
            localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(CURRENT_USER));
            document.getElementById('userNameChip').textContent = name;
            setStatus(status, '✅ Profile updated successfully!', 'success');
          } else {
            setStatus(status, (res && res.error) || 'Something went wrong. Please try again.', 'error');
          }
          setBtnLoading(btn, false);
        })
        .catch(function () {
          setStatus(status, "Couldn't reach the server. Please check your connection and try again.", 'error');
          setBtnLoading(btn, false);
        });

      return false;
    }

    // ---------- Change password ----------

    function handlePasswordChange(e) {
      e.preventDefault();
      var btn = document.getElementById('passSaveBtn');
      var status = document.getElementById('passStatus');
      var currentPassword = document.getElementById('currentPassword').value;
      var newPassword = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        setStatus(status, 'New password must be at least 8 characters.', 'error');
        return false;
      }
      if (newPassword !== confirmPassword) {
        setStatus(status, 'New passwords do not match.', 'error');
        return false;
      }

      setBtnLoading(btn, true, 'Updating…');
      setStatus(status, '', '');

      // changePassword can succeed server-side even when the response
      // never makes it back cleanly (same issue as every write in this
      // app). It's not safe to just retry — a real duplicate attempt
      // would use the now-stale currentPassword and fail — so on failure,
      // check whether the change actually went through by trying to log
      // in with the new password (a safe, side-effect-free check).
      function recoverOrFail() {
        callApi('loginUser', { email: CURRENT_USER.email, password: newPassword }).then(function (res) {
          if (res && res.success) {
            setStatus(status, '✅ Password updated successfully!', 'success');
            document.getElementById('passwordForm').reset();
          } else {
            setStatus(status, "Couldn't reach the server. Please try again.", 'error');
          }
          setBtnLoading(btn, false);
        }).catch(function () {
          setStatus(status, "Couldn't reach the server. Please check your connection and try again.", 'error');
          setBtnLoading(btn, false);
        });
      }

      callApi('changePassword', { userId: CURRENT_USER.userId, currentPassword: currentPassword, newPassword: newPassword })
        .then(function (res) {
          if (res && res.success) {
            setStatus(status, '✅ Password updated successfully!', 'success');
            document.getElementById('passwordForm').reset();
            setBtnLoading(btn, false);
          } else {
            setStatus(status, res && res.error === 'Current password is incorrect' ? '❌ Current password is incorrect' : ((res && res.error) || 'Something went wrong.'), 'error');
            setBtnLoading(btn, false);
          }
        })
        .catch(recoverOrFail);

      return false;
    }

    // ---------- Notification bell ----------

    function notifIcon(type) {
      if (type === 'Ready for Collection') return 'ti-package';
      if (type === 'Quotation Sent') return 'ti-file-invoice';
      if (type === 'Order Confirmed') return 'ti-checkbox';
      if (type === 'Delivered') return 'ti-truck-delivery';
      if (type === 'Class Published') return 'ti-school';
      return 'ti-bell';
    }

    function notifTitle(type) {
      var map = {
        'Quotation Requested': 'Order Received',
        'Quotation Sent': 'Quotation Ready',
        'Order Confirmed': 'Order Confirmed',
        'Ready for Collection': 'Ready for Collection',
        'Class Published': 'New Tailoring Class'
      };
      return map[type] || 'Status Update';
    }

    function loadNotifications() {
      // Deferred into .then() so a synchronous throw from callApi() (e.g.
      // CONFIG not loaded yet) becomes a normal rejection instead of an
      // uncaught exception — see the identical comment in dashboard.html's
      // loadDashboardData for the full reasoning.
      Promise.resolve().then(function () {
        return callApi('getNotifications', { userId: CURRENT_USER.userId });
      }).then(function (res) {
        notifications = (res && res.success) ? res.data.notifications : [];
        renderNotifDropdown();
        updateNotifBadge();
      }).catch(function (err) {
        console.error('loadNotifications failed:', err);
        document.getElementById('notifList').innerHTML = '<p class="notif-empty">Couldn\'t load notifications.</p>';
      });
    }

    function renderNotifDropdown() {
      var list = document.getElementById('notifList');
      if (!notifications.length) {
        list.innerHTML = '<p class="notif-empty">No notifications yet.</p>';
        return;
      }
      list.innerHTML = notifications.map(function (n) {
        return '' +
          '<button type="button" class="notif-item' + (n.IsRead ? '' : ' unread') + '" onclick="handleNotifClick(\'' + n.NotificationID + '\')">' +
            '<i class="ti ' + notifIcon(n.Type) + ' notif-item-icon" aria-hidden="true"></i>' +
            '<span class="notif-item-body">' +
              '<span class="notif-item-title">' + esc(notifTitle(n.Type)) + '</span>' +
              '<span class="notif-item-msg">' + esc(n.Message) + '</span>' +
              '<span class="notif-item-time">' + timeAgo(n.CreatedAt) + '</span>' +
            '</span>' +
          '</button>';
      }).join('');
    }

    function updateNotifBadge() {
      var unreadCount = notifications.filter(function (n) { return !n.IsRead; }).length;
      var badge = document.getElementById('notifBadge');
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    // This page doesn't render an orders list, so "navigate to the relevant
    // order" means sending the customer to dashboard.html, where it lives —
    // except a class announcement isn't order-related at all, so that one
    // goes straight to classes.html instead.
    function handleNotifClick(notificationId) {
      var n = notifications.filter(function (x) { return x.NotificationID === notificationId; })[0];
      if (!n) return;
      if (!n.IsRead) {
        callApi('markNotificationRead', { userId: CURRENT_USER.userId, notificationId: notificationId }).catch(function () {});
      }
      window.location.href = n.Type === 'Class Published' ? 'classes.html' : 'dashboard.html';
    }

    document.getElementById('notifBellBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var dropdown = document.getElementById('notifDropdown');
      var isOpen = dropdown.classList.toggle('open');
      document.getElementById('notifBellBtn').setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', function (e) {
      var wrap = document.querySelector('.notif-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('notifDropdown').classList.remove('open');
        document.getElementById('notifBellBtn').setAttribute('aria-expanded', 'false');
      }
    });

    // ---------- Init ----------

    if (CURRENT_USER && CURRENT_USER.userId) {
      fillProfileForm();
      loadNotifications();
    }
  </script>

</body>
</html>
