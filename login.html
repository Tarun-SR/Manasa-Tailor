<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — Manasa Tailor</title>
  <meta name="description" content="Login or create your Manasa Tailor account to track orders, save measurements, and get updates on your custom stitching.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --rose: #c9728a;
      --rose-light: #f5e6eb;
      --rose-dark: #8b3d52;
      --gold: #b8924a;
      --gold-dark: #7f6533;
      --gold-light: #f7f0e3;
      --cream: #fdf8f5;
      --dark: #2c1a20;
      --muted: #7a5a64;
      --border: #e8d5da;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--rose-dark);
      letter-spacing: 1px;
      text-decoration: none;
    }

    .nav-logo span { color: var(--gold); font-style: italic; }

    .nav-home {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
      font-weight: 500;
    }

    .nav-home:hover { color: var(--rose-dark); }

    /* ── Auth card ── */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .auth-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-width: 440px;
      width: 100%;
      padding: 40px 36px;
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 10px;
      font-weight: 500;
      text-align: center;
    }

    .auth-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 300;
      color: var(--dark);
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-title em { font-style: italic; color: var(--rose); }

    .auth-subtitle {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .auth-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .auth-tab {
      flex: 1;
      background: var(--cream);
      border: none;
      padding: 12px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .auth-tab.active { background: var(--rose-dark); color: white; }

    .auth-form { display: flex; flex-direction: column; gap: 16px; }

    .auth-field { display: flex; flex-direction: column; gap: 6px; }

    .auth-field label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .auth-field label .optional { text-transform: none; letter-spacing: 0; opacity: .7; }

    .input-icon { position: relative; display: flex; align-items: center; }

    .input-icon i {
      position: absolute;
      left: 12px;
      color: var(--rose);
      font-size: 16px;
      pointer-events: none;
    }

    .input-icon input {
      width: 100%;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      color: var(--dark);
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 11px 12px 11px 38px;
      outline: none;
    }

    .input-icon input:focus { border-color: var(--rose); }

    .btn-primary {
      background: var(--rose-dark);
      color: white;
      border: none;
      padding: 13px 28px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: background .2s, transform .15s;
    }

    .btn-primary:hover:not(:disabled) { background: var(--rose); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .auth-submit { width: 100%; margin-top: 4px; }

    .auth-status {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
      text-align: center;
    }

    .auth-status.success { color: var(--rose-dark); font-weight: 500; }
    .auth-status.error { color: #b23b3b; font-weight: 500; }

    .forgot-link {
      display: block;
      margin: 2px auto 0;
      background: none;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      color: var(--rose-dark);
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
    }

    .forgot-message {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      background: var(--gold-light);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px;
    }

    .forgot-message a { color: var(--rose-dark); font-weight: 500; }

    /* ── Footer ── */
    .footer-mini {
      background: var(--dark);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-mini p { font-size: 11px; color: rgba(255,255,255,.4); }

    .footer-mini a {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .2s;
    }

    .footer-mini a:hover { color: var(--rose); }

    /* ── Floating WhatsApp ── */
    .wa-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(37,211,102,.45);
      z-index: 999;
      text-decoration: none;
      transition: transform .2s;
    }

    .wa-float:hover { transform: scale(1.1); }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .nav { padding: 14px 18px; }
      .auth-wrap { padding: 28px 16px; }
      .auth-card { padding: 32px 22px; }
      .auth-title { font-size: 26px; }
      .footer-mini { flex-direction: column; text-align: center; }
    }

    @media (max-width: 380px) {
      .nav-home span { display: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">Manasa <span>Tailor</span></a>
    <a href="index.html" class="nav-home">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
      Back to Home
    </a>
  </nav>

  <!-- Main -->
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="auth-eyebrow">Welcome to Manasa Tailor</p>
      <h1 class="auth-title">Your <em>Boutique</em> Account</h1>
      <p class="auth-subtitle">Track orders, save measurements and get updates — all in one place.</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tabRegisterBtn" role="tab" aria-selected="true" aria-controls="registerForm" onclick="switchTab('register')">Register</button>
        <button type="button" class="auth-tab" id="tabLoginBtn" role="tab" aria-selected="false" aria-controls="loginForm" onclick="switchTab('login')">Login</button>
      </div>

      <!-- Register -->
      <form id="registerForm" class="auth-form" onsubmit="return handleRegister(event)">
        <div class="auth-field">
          <label for="regName">Full Name</label>
          <div class="input-icon">
            <i class="ti ti-user" aria-hidden="true"></i>
            <input id="regName" type="text" autocomplete="name" required placeholder="e.g. Priya Sharma">
          </div>
        </div>
        <div class="auth-field">
          <label for="regMobile">Mobile (WhatsApp)</label>
          <div class="input-icon">
            <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
            <input id="regMobile" type="tel" autocomplete="tel" required placeholder="10-digit mobile number">
          </div>
        </div>
        <div class="auth-field">
          <label for="regEmail">Email</label>
          <div class="input-icon">
            <i class="ti ti-mail" aria-hidden="true"></i>
            <input id="regEmail" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="auth-field">
          <label for="regPassword">Password</label>
          <div class="input-icon">
            <i class="ti ti-lock" aria-hidden="true"></i>
            <input id="regPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
          </div>
        </div>
        <div class="auth-field">
          <label for="regCity">City <span class="optional">(optional)</span></label>
          <div class="input-icon">
            <i class="ti ti-map-pin" aria-hidden="true"></i>
            <input id="regCity" type="text" autocomplete="address-level2" placeholder="e.g. Tumkur">
          </div>
        </div>
        <button type="submit" class="btn-primary auth-submit" id="regSubmitBtn">Create Account</button>
        <p class="auth-status" id="regStatus" role="status" aria-live="polite"></p>
      </form>

      <!-- Login -->
      <form id="loginForm" class="auth-form" style="display:none" onsubmit="return handleLogin(event)">
        <div class="auth-field">
          <label for="loginEmail">Email</label>
          <div class="input-icon">
            <i class="ti ti-mail" aria-hidden="true"></i>
            <input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <div class="input-icon">
            <i class="ti ti-lock" aria-hidden="true"></i>
            <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Your password">
          </div>
        </div>
        <button type="submit" class="btn-primary auth-submit" id="loginSubmitBtn">Login</button>
        <p class="auth-status" id="loginStatus" role="status" aria-live="polite"></p>
        <button type="button" class="forgot-link" id="forgotBtn" onclick="toggleForgotPassword()">Forgot Password?</button>
        <p class="forgot-message" id="forgotMessage" style="display:none">
          Please <a href="https://wa.me/916360194277" target="_blank" rel="noopener">WhatsApp us at +91 63601 94277</a> to reset your password.
        </p>
      </form>
    </div>
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/916360194277?text=Hi%20Manasa%20Tailor!%20I%20need%20help%20with%20my%20account."
     target="_blank" rel="noopener" class="wa-float" aria-label="Chat on WhatsApp">
    <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
  </a>

  <!-- Footer -->
  <footer class="footer-mini">
    <p>© <span id="yr"></span> Manasa Tailor. All rights reserved.</p>
    <a href="index.html">
      <i class="ti ti-needle-thread" aria-hidden="true"></i>
      Manasa Tailor — Tumkur, Karnataka
    </a>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Same Apps Script Web App deployment used by the index.html order form.
    var GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw2KxuusQ5rHQO4hXlpLhPFL2DtrWQeX7pnTVud4w9w4TL6bH1w4vYao1sPjxXWQKycMg/exec";
    var USER_STORAGE_KEY = 'manasaUser';

    // Only ever redirect to one of our own pages — trusting an arbitrary
    // ?redirect= value would let someone craft a link that bounces a
    // freshly-logged-in customer straight to an external phishing page.
    var REDIRECT_ALLOWLIST = ['booking.html', 'dashboard.html'];
    function getRedirectTarget() {
      var requested = new URLSearchParams(window.location.search).get('redirect');
      return REDIRECT_ALLOWLIST.indexOf(requested) !== -1 ? requested : 'dashboard.html';
    }

    // If already logged in, skip straight to the destination.
    (function redirectIfLoggedIn() {
      try {
        var existing = JSON.parse(localStorage.getItem(USER_STORAGE_KEY) || 'null');
        if (existing && existing.userId) {
          window.location.replace(getRedirectTarget());
        }
      } catch (err) {
        localStorage.removeItem(USER_STORAGE_KEY);
      }
    })();

    function switchTab(tab) {
      var isRegister = tab === 'register';
      document.getElementById('registerForm').style.display = isRegister ? 'flex' : 'none';
      document.getElementById('loginForm').style.display = isRegister ? 'none' : 'flex';
      document.getElementById('tabRegisterBtn').classList.toggle('active', isRegister);
      document.getElementById('tabLoginBtn').classList.toggle('active', !isRegister);
      document.getElementById('tabRegisterBtn').setAttribute('aria-selected', String(isRegister));
      document.getElementById('tabLoginBtn').setAttribute('aria-selected', String(!isRegister));
    }

    // Apps Script web apps don't handle CORS preflight, so text/plain keeps
    // this a "simple request" and avoids an OPTIONS call the backend can't answer.
    function callApi(action, payload) {
      var body = { action: action };
      for (var key in payload) body[key] = payload[key];
      return fetch(GOOGLE_SHEET_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(function (res) { return res.json(); });
    }

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = 'auth-status' + (type ? ' ' + type : '');
    }

    function saveUserAndRedirect(user) {
      localStorage.setItem(USER_STORAGE_KEY, JSON.stringify({
        userId: user.userId,
        name: user.name,
        email: user.email,
        mobile: user.phone,
        city: user.city || ''
      }));
      window.location.href = getRedirectTarget();
    }

    function handleRegister(e) {
      e.preventDefault();
      var btn = document.getElementById('regSubmitBtn');
      var status = document.getElementById('regStatus');
      var name = document.getElementById('regName').value.trim();
      var mobile = document.getElementById('regMobile').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value;
      var city = document.getElementById('regCity').value.trim();

      if (!name || !mobile || !email || !password) {
        setStatus(status, 'Please fill in all required fields.', 'error');
        return false;
      }
      if (!/^\+?[0-9]{10,15}$/.test(mobile.replace(/[\s-]/g, ''))) {
        setStatus(status, 'Please enter a valid mobile number.', 'error');
        return false;
      }
      if (password.length < 8) {
        setStatus(status, 'Password must be at least 8 characters.', 'error');
        return false;
      }

      btn.disabled = true;
      btn.textContent = 'Creating Account…';
      setStatus(status, '', '');

      callApi('createUser', { name: name, phone: mobile, email: email, password: password, city: city })
        .then(function (res) {
          if (res && res.success) {
            setStatus(status, 'Account created! Redirecting…', 'success');
            saveUserAndRedirect(res.data);
          } else {
            setStatus(status, (res && res.error) || 'Could not create your account. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Create Account';
          }
        })
        .catch(function () {
          setStatus(status, "Couldn't reach the server. Please check your connection and try again.", 'error');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        });

      return false;
    }

    function handleLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('loginSubmitBtn');
      var status = document.getElementById('loginStatus');
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        setStatus(status, 'Please enter your email and password.', 'error');
        return false;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in…';
      setStatus(status, '', '');

      callApi('loginUser', { email: email, password: password })
        .then(function (res) {
          if (res && res.success) {
            setStatus(status, 'Welcome back! Redirecting…', 'success');
            saveUserAndRedirect(res.data);
          } else {
            setStatus(status, 'Incorrect email or password', 'error');
            btn.disabled = false;
            btn.textContent = 'Login';
          }
        })
        .catch(function () {
          setStatus(status, "Couldn't reach the server. Please check your connection and try again.", 'error');
          btn.disabled = false;
          btn.textContent = 'Login';
        });

      return false;
    }

    function toggleForgotPassword() {
      var msg = document.getElementById('forgotMessage');
      msg.style.display = msg.style.display === 'none' ? 'block' : 'none';
    }
  </script>

</body>
</html>
